<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>PLANET MERGE - 惑星合体ゲーム</title>
  <meta name="description" content="月から太陽まで合体させてハイスコアを目指そう！スイカゲーム風の宇宙テーマ惑星合体物理パズルゲーム。">
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Zen+Kaku+Gothic+New:wght@500;700&display=swap" rel="stylesheet">

  <!-- Matter.js Physics Engine -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>

  <!-- Config & Google Tag Manager (gtag.js) -->
  <script src="config.js"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    if (typeof GTM_ID !== 'undefined' && GTM_ID) {
      const gtmScript = document.createElement('script');
      gtmScript.async = true;
      gtmScript.src = `https://www.googletagmanager.com/gtag/js?id=${GTM_ID}`;
      document.head.appendChild(gtmScript);
      gtag('config', GTM_ID);
    }
  </script>

  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="stars-bg"></div>
  <div class="twinkle-bg"></div>

  <main class="app-container">
    <!-- Header Controls & Scores -->
    <header class="game-header">
      <div class="logo-group">
        <h1 class="game-title">PLANET MERGE</h1>
        <span class="game-subtitle">惑星合体ゲーム</span>
      </div>

      <div class="score-board">
        <div class="score-card">
          <span class="score-label">SCORE</span>
          <span id="current-score" class="score-value">0</span>
        </div>
        <div class="score-card highlight">
          <span class="score-label">BEST</span>
          <span id="high-score" class="score-value">0</span>
        </div>
      </div>

      <div class="header-actions">
        <button id="btn-sound" class="icon-btn" title="サウンド切替" aria-label="Sound Toggle">
          <svg id="sound-icon-on" viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
            <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
          </svg>
          <svg id="sound-icon-off" viewBox="0 0 24 24" width="22" height="22" fill="currentColor" class="hidden">
            <path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>
          </svg>
        </button>

        <button id="btn-info" class="icon-btn" title="遊び方" aria-label="Game Info">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
            <path d="M11 17h2v-6h-2v6zm1-15C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm0-14c-.55 0-1 .45-1 1s.45 1 1 1 1-.45 1-1-.45-1-1-1z"/>
          </svg>
        </button>

        <button id="btn-restart" class="icon-btn" title="リスタート" aria-label="Restart Game">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
            <path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- Next Planet Preview Panel -->
    <div class="next-preview-bar">
      <span class="preview-label">NEXT:</span>
      <div class="next-planet-display">
        <div id="next-planet-badge" class="next-planet-badge"></div>
        <span id="next-planet-name" class="next-planet-name">水星</span>
      </div>
    </div>

    <!-- Main Game Canvas Container -->
    <div id="game-container" class="game-container">
      <div id="danger-line" class="danger-line"></div>
      <canvas id="game-canvas" width="440" height="660"></canvas>
    </div>

    <!-- Controls Banner -->
    <div class="controls-hint">
      <span>画面をタップまたはクリックして惑星を落とそう！</span>
    </div>
  </main>

  <!-- Info Modal -->
  <div id="info-modal" class="modal-backdrop hidden">
    <div class="modal-card">
      <div class="modal-header">
        <h2>遊び方 ＆ 惑星進化表</h2>
        <button id="btn-close-info" class="close-btn">&times;</button>
      </div>
      <div class="modal-body">
        <p class="info-desc">同じ惑星同士をぶつけると合体して1つ大きな惑星に進化します！太陽同士をぶつけると大消滅して大量ボーナス獲得！上限ラインを超えないようにハイスコアを目指しましょう。</p>

        <div class="evolution-grid">
          <div class="evolution-card"><canvas class="evo-canvas" data-level="0" width="56" height="56"></canvas><span class="evo-name">月</span><span class="evo-score">+2</span></div>
          <div class="evo-arrow">→</div>
          <div class="evolution-card"><canvas class="evo-canvas" data-level="1" width="56" height="56"></canvas><span class="evo-name">水星</span><span class="evo-score">+4</span></div>
          <div class="evo-arrow">→</div>
          <div class="evolution-card"><canvas class="evo-canvas" data-level="2" width="56" height="56"></canvas><span class="evo-name">火星</span><span class="evo-score">+8</span></div>
          <div class="evo-arrow">→</div>
          <div class="evolution-card"><canvas class="evo-canvas" data-level="3" width="56" height="56"></canvas><span class="evo-name">金星</span><span class="evo-score">+16</span></div>
          <div class="evo-arrow">→</div>
          <div class="evolution-card"><canvas class="evo-canvas" data-level="4" width="56" height="56"></canvas><span class="evo-name">地球</span><span class="evo-score">+32</span></div>
          <div class="evo-arrow">→</div>
          <div class="evolution-card"><canvas class="evo-canvas" data-level="5" width="56" height="56"></canvas><span class="evo-name">海王星</span><span class="evo-score">+64</span></div>
          <div class="evo-arrow">→</div>
          <div class="evolution-card"><canvas class="evo-canvas" data-level="6" width="56" height="56"></canvas><span class="evo-name">天王星</span><span class="evo-score">+128</span></div>
          <div class="evo-arrow">→</div>
          <div class="evolution-card"><canvas class="evo-canvas" data-level="7" width="56" height="56"></canvas><span class="evo-name">土星</span><span class="evo-score">+256</span></div>
          <div class="evo-arrow">→</div>
          <div class="evolution-card"><canvas class="evo-canvas" data-level="8" width="56" height="56"></canvas><span class="evo-name">木星</span><span class="evo-score">+512</span></div>
          <div class="evo-arrow">→</div>
          <div class="evolution-card highlight-sun"><canvas class="evo-canvas" data-level="9" width="56" height="56"></canvas><span class="evo-name">太陽</span><span class="evo-score">+1024</span></div>
        </div>
      </div>
      <div class="modal-footer">
        <button id="btn-start-game" class="primary-btn">プレイ開始</button>
      </div>
    </div>
  </div>

  <!-- Game Over Modal -->
  <div id="gameover-modal" class="modal-backdrop hidden">
    <div class="modal-card gameover-card">
      <div class="gameover-title">GAME OVER</div>
      <p class="gameover-sub">惑星が溢れてしまいました！</p>
      
      <div class="final-scores">
        <div class="score-row">
          <span>スコア</span>
          <span id="final-score" class="val">0</span>
        </div>
        <div class="score-row highlight">
          <span>ハイスコア</span>
          <span id="final-high-score" class="val">0</span>
        </div>
        <div class="score-row">
          <span>到達レベル</span>
          <span id="max-planet-reached" class="val planet-tag">月</span>
        </div>
      </div>

      <button id="btn-play-again" class="primary-btn glow">もう一度プレイ</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
